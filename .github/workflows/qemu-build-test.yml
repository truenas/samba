name: Build & Test

# Builds this TrueNAS Samba tree inside a Debian Trixie VM running the TrueNAS
# kernel, against the prebuilt TrueNAS OpenZFS (kmod + userland), then
# smoke-tests the TrueNAS VFS stack (zfs_core, truenas_streams_xattr, ...) on a
# real ZFS dataset.
#
# The kernel image + UAPI headers (truenas/linux) and the OpenZFS debs
# (truenas/zfs) are consumed from the rolling <train>-nightly GitHub releases
# rather than built here, so CI compiles and runs against the same kernel/ZFS
# pair TrueNAS ships -- which is also what debian/control's
# linux-truenas-production-libc-dev Build-Depends demands.
#
# A VM is required (not a plain container) because:
#   * the prebuilt OpenZFS kmod only loads under the matching running kernel,
#     so the VM has to boot the TrueNAS kernel, and
#   * smbd/the VFS modules need real root + a real ZFS pool to exercise.

on:
  pull_request:
  push:
    branches:
      - 'truenas/**'
      - 'SCALE-**'
      - 'stable/**'
  workflow_call:
    inputs:
      train:
        # TrueNAS train (master or 26) whose rolling <train>-nightly kernel
        # and OpenZFS releases to build and test against.  Empty (the
        # default, used by nightly.yml and PR runs) means derive it from the
        # branch via train-for-ref.sh.  Callers may pass a specific train to
        # pin one.
        description: "(optional) TrueNAS train to build against ('master' or '26'; default: derived from branch)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      train:
        type: string
        required: false
        default: ""
        description: "(optional) TrueNAS train to build against ('master' or '26'; default: derived from branch)"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Bump IMAGE_VERSION to bust the cloud-image and ccache caches together (e.g.
# after a change that invalidates every cached object, such as moving to a
# different kernel's UAPI headers).
env:
  IMAGE_VERSION: v2

jobs:
  build-test:
    name: Debian Trixie
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        # PR runs check out the PR head; push / workflow_dispatch /
        # workflow_call runs (nightly) have no PR event, so fall back to the
        # triggering commit.
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Determine TrueNAS train
      id: train
      run: |
        # One train selects both the kernel and the OpenZFS built against it:
        # an explicit input (workflow_dispatch or workflow_call) wins,
        # otherwise the branch (the PR base on PRs, else the triggering ref)
        # maps to its train.
        if [ -n "${{ inputs.train }}" ]; then
          TRAIN="${{ inputs.train }}"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          TRAIN="$(.github/workflows/scripts/train-for-ref.sh "${{ github.base_ref }}")"
        else
          TRAIN="$(.github/workflows/scripts/train-for-ref.sh "${{ github.ref_name }}")"
        fi
        echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
        echo "Using TrueNAS train: $TRAIN"

    - name: Setup QEMU
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-1-setup.sh

    - name: Cache Debian Trixie cloud image
      id: cache-image
      uses: actions/cache@v4
      with:
        path: /tmp/qemu-work/debian-trixie.qcow2
        key: debian-trixie-cloudimage-${{ env.IMAGE_VERSION }}

    # ccache speeds up the (full, per-PR) Samba rebuild. Rolling key: restore
    # the most recent cache, save an updated one keyed on this commit.
    - name: Cache ccache (Samba build)
      uses: actions/cache@v4
      with:
        path: /tmp/ccache
        key: ccache-samba-debian-trixie-${{ env.IMAGE_VERSION }}-${{ github.sha }}
        restore-keys: |
          ccache-samba-debian-trixie-${{ env.IMAGE_VERSION }}-

    - name: Start Debian Trixie VM
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-2-start.sh

    # Installs the prebuilt kernel + OpenZFS, then builds + installs this Samba
    # tree against them. This is the long pole — full Samba build from source.
    - name: Build Samba against the TrueNAS kernel + OpenZFS
      timeout-minutes: 150
      env:
        TRAIN: ${{ steps.train.outputs.train }}
      run: bash .github/workflows/scripts/qemu-3-build.sh

    - name: Restart VM into the TrueNAS kernel
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-3.5-restart.sh

    - name: Smoke-test the TrueNAS VFS stack on ZFS
      # Bumped from 25: now also runs the truenas streams/shadow_copy/acl torture
      # suites and a curated set of upstream smb2.* regression suites.
      timeout-minutes: 45
      run: bash .github/workflows/scripts/qemu-4-test.sh

    - name: Collect logs
      if: always()
      timeout-minutes: 5
      run: bash .github/workflows/scripts/qemu-5-collect-logs.sh

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: samba-build-test-logs-debian-trixie
        path: /tmp/qemu-logs.tar.gz
        if-no-files-found: ignore

    - name: Test Summary
      if: always()
      run: bash .github/workflows/scripts/qemu-6-summary.sh
