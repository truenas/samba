[package]
name = "truenas_smbhad_client"
description = "The client of truenas_smbhad in smbd, with a C interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# smbd links the static library. The tests of the daemon use the rlib.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
truenas_smbhad_proto.workspace = true
truenas_xdr.workspace = true
serde.workspace = true
libc.workspace = true
# smbd links these crates through this static library.
truenas_smbros.workspace = true
truenas_smb_server.workspace = true
truenas_smb_vfs.workspace = true

[lints]
workspace = true
