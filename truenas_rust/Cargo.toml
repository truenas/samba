# truenas_rust: the TrueNAS Rust code in the Samba tree.
#
# This Cargo workspace has the crates of truenas_smbhad, the durable SMB handle
# state for TrueNAS HA:
# - smbhad/proto: the messages of smbd and the daemon, and the epoch file
# - smbhad/daemon: truenas_smbhad
# - smbhad/client: the client in smbd, with the record of a durable handle and
#   the durable cookie of vfs_zfs_core. A static library with a C header that
#   smbd links.
# The workspace also has the reactors of smbd on io_uring. See README.md.
# - mit/smbros: the socket layer of an SMB server, one reactor thread and
#   ring per connection
# - gpl/smb-server, gpl/smb-vfs: the layer of smbd above the shim
# build.sh builds the workspace before waf builds Samba. Cargo.lock is in
# git. `rev` pins each git dependency to a commit. A package build is
# reproducible.
[workspace]
resolver = "3"
members = [
    "smbhad/proto",
    "smbhad/daemon",
    "smbhad/client",
    "mit/smbros",
    "gpl/smb-server",
    "gpl/smb-vfs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
truenas_ros = { git = "https://github.com/truenas/truenas_ros", rev = "9c51fc40889c99775dd80c99c35ba7456cbaea93", default-features = false }
truenas_xdr = { git = "https://github.com/truenas/truenas_ros_utils", rev = "0c3bf46bb3e4bdac62d1688ae87815e9b6b4bea8" }
truenas_smbhad_proto = { path = "smbhad/proto" }
truenas_smbhad_client = { path = "smbhad/client" }
truenas_smbros = { path = "mit/smbros" }
truenas_smb_server = { path = "gpl/smb-server" }
truenas_smb_vfs = { path = "gpl/smb-vfs" }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
# OpenSSL (libcrypto) for the link handshake: HKDF, HMAC and the random
# nonces, as in truenas_ros. The package build needs libssl-dev. In FIPS
# mode, the FIPS provider of OpenSSL does this work.
openssl = "0.10"

# proto and daemon forbid unsafe code at their crate roots. Only the C
# interface of the client allows it.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
debug = 1
